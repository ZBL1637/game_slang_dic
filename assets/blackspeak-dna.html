<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑话 DNA 测试</title>
  <link rel="stylesheet" href="quiz-refinements.css">
</head>
<body>
  <main class="blackspeak-dna-container" id="dnaContainer">
    <svg class="dna-deco" viewBox="0 0 540 200" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="glow"><stop stop-color="#5cc3ff" stop-opacity="0"/><stop offset=".5" stop-color="#5cc3ff" stop-opacity=".3"/><stop offset="1" stop-color="#5cc3ff" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 18H480q30 0 30 30v152 M0 34H464q30 0 30 30v136 M0 50H448q30 0 30 30v120 M0 66H432q30 0 30 30v104" fill="none" stroke="url(#glow)"/>
    </svg>
    <header class="dna-header">
      <div class="dna-title"><span class="dna-accent" id="brandLabel">黑话</span> DNA</div>
      <button class="dna-reset-btn" id="headerReset" type="button">重新开始</button>
    </header>
    <section class="dna-card" id="introCard" aria-labelledby="introTitle">
      <div class="dna-step" id="introEyebrow">8 个问题 · 一份游戏偏好速写</div>
      <h1 class="dna-big-text" id="introTitle">你的游戏“黑话”基因，究竟来自哪里？</h1>
      <p class="dna-muted" id="introDescription">回到你熟悉的游戏现场：怎样回复队友，把时间留给什么，能否听懂一条战术指令。</p>
      <ul class="dna-bullets" id="introBullets"></ul>
      <p class="dna-note" id="savedNote" hidden></p>
      <button class="dna-primary-btn" id="startBtn" type="button">开始测试</button>
    </section>
    <section class="dna-card dna-hidden" id="quizCard" aria-labelledby="questionTitle">
      <div class="dna-step-row"><span class="dna-step" id="stepInfo">问题 1 / 8</span><span class="dna-type" id="questionType"></span></div>
      <div class="dna-progress" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><div class="dna-progress-bar" id="progressBar"></div></div>
      <h2 class="dna-qtitle" id="questionTitle" tabindex="-1"></h2>
      <p class="dna-qsub" id="questionSubtitle"></p>
      <blockquote class="dna-context" id="questionContext" hidden></blockquote>
      <div class="dna-options" id="optionsContainer" aria-labelledby="questionTitle"></div>
      <div class="dna-ranking" id="rankingContainer" hidden></div>
      <p class="dna-answer-status" id="answerStatus" role="status" aria-live="polite"></p>
      <div class="dna-actions">
        <button class="dna-ghost-btn" id="prevBtn" type="button">上一步</button>
        <button class="dna-primary-btn" id="nextBtn" type="button" disabled>下一步</button>
      </div>
    </section>
    <section class="dna-card dna-hidden" id="reportCard" aria-labelledby="reportTitle">
      <h2 class="dna-report-title" id="reportTitle" tabindex="-1">你的黑话 DNA 报告</h2>
      <p class="dna-note dna-centered" id="reportCaption"></p>
      <div class="dna-ring-wrap">
        <svg viewBox="0 0 200 200" id="donutChart" aria-hidden="true"></svg>
        <div class="dna-ring-center"><span class="dna-center-label" id="ringLabel"></span><strong class="dna-center-genre" id="topGenre"></strong><span class="dna-center-percent" id="topPercent"></span></div>
      </div>
      <div class="dna-badges" id="badgesContainer"></div>
      <section class="dna-panel"><h3 class="dna-panel-title" id="evidenceTitle"></h3><div id="evidenceContainer"></div></section>
      <section class="dna-panel"><h3 class="dna-panel-title" id="communicationTitle"></h3><p class="dna-result-lead" id="communicationSummary"></p><div id="communicationEvidence"></div></section>
      <section class="dna-panel"><h3 class="dna-panel-title" id="gamesTitle"></h3><div id="gamesContainer"></div></section>
      <section class="dna-panel"><h3 class="dna-panel-title" id="knowledgeTitle"></h3><p class="dna-result-lead" id="knowledgeSummary"></p><div id="knowledgeContainer"></div></section>
      <section class="dna-panel"><h3 class="dna-panel-title" id="shareTitle"></h3><p class="dna-copy" id="shareCopy"></p></section>
      <div class="dna-actions"><button class="dna-ghost-btn" id="reportReset" type="button">重新测试</button><button class="dna-primary-btn" id="shareBtn" type="button">复制结果</button></div>
      <p class="dna-answer-status" id="shareStatus" role="status" aria-live="polite"></p>
    </section>
    <p class="dna-footer" id="quizFooter"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="quiz-content.js"></script>
  <script src="quiz-model.js"></script>
  <script src="blackspeak-dna.js"></script>
</body>
</html>
